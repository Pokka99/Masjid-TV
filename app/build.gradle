plugins {
    id 'com.android.application'
}

android {
    namespace 'my.masjid.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'my.masjid.tv'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded, never published: debug key so updates install over each other.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader: the page runs from an https address so YouTube and Facebook embeds work.
    implementation 'androidx.webkit:webkit:1.12.1'
}
